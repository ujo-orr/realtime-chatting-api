spring:
  application:
    name: realtime-chatting-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chatting?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:chatting}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m
  refresh-ttl: 7d
auth:
  cookie-secure: ${COOKIE_SECURE:true}
